<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airtel Prêts</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { margin: 0; padding: 0; background-color: #E40000; display: flex; justify-content: center; min-height: 100vh; }
        .app-container { width: 100%; max-width: 400px; background: white; position: relative; min-height: 100vh; }
        
        .header { background-color: #E40000; padding: 20px; text-align: center; color: white; }
        .header h1 { margin: 0; font-size: 24px; font-weight: bold; }

        .calc-wrapper { padding: 15px; background: #f9f9f9; height: 100vh; }
        .calc-card { background: white; border: 2px solid #E40000; border-radius: 12px; padding: 20px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        
        .amount-display { font-size: 32px; font-weight: bold; color: #E40000; margin: 10px 0; }
        
        /* Slider Styling */
        input[type=range] { 
            width: 100%; 
            margin: 15px 0; 
            -webkit-appearance: none; 
            background: transparent; 
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: #E40000;
            cursor: pointer;
            margin-top: -8px;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 8px;
            background: #ddd;
            border-radius: 5px;
        }
        
        .term-buttons { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
        .term-btn { padding: 10px; border: 1px solid #ccc; background: white; color: #333; font-weight: bold; border-radius: 6px; cursor: pointer; }
        .term-btn.active { background-color: #E40000; color: white; border-color: #E40000; }
        
        .payment-box { background-color: #fff0f0; border: 1px solid #E40000; padding: 15px; border-radius: 8px; margin-top: 20px; }
        .payment-amount { font-size: 28px; font-weight: bold; color: #E40000; margin: 5px 0; }
        
        .btn-main { width: 100%; background-color: #E40000; color: white; font-size: 16px; font-weight: bold; padding: 15px; border: none; border-radius: 8px; margin-top: 20px; cursor: pointer; text-transform: uppercase; }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header"><h1>Airtel Prêts</h1></div>
        <div class="calc-wrapper">
            <div class="calc-card">
                <h3 style="margin:0; color:#E40000;">CALCULATRICE DE PRÊT</h3>
                <p style="font-size:12px; font-weight:bold; color:#666; margin-bottom:0; margin-top:15px;">MONTANT DU PRÊT</p>
                
                <!-- Changed to USD -->
                <div class="amount-display" id="amountText">USD 50,000.00</div>
                
                <input type="range" id="slider" min="500" max="50000" step="500" value="50000" oninput="calculate()">
                
                <p style="font-size:12px; font-weight:bold; color:#666; margin-bottom:5px;">DURÉE DU PRÊT</p>
                <div class="term-buttons">
                    <button type="button" class="term-btn" id="btn6" onclick="setTerm(6)">6 mois</button>
                    <button type="button" class="term-btn active" id="btn12" onclick="setTerm(12)">12 mois</button>
                    <button type="button" class="term-btn" id="btn24" onclick="setTerm(24)">24 mois</button>
                </div>
                
                <div class="payment-box">
                    <p style="margin:0; font-size:12px; letter-spacing:1px; color:#666;">PAIEMENT MENSUEL</p>
                    <!-- Changed to USD -->
                    <div class="payment-amount" id="paymentText">USD 4,268.93</div>
                </div>
                
                <button class="btn-main" onclick="alert('Proceeding to next step...')">DEMANDER MAINTENANT</button>
            </div>
        </div>
    </div>

    <script>
        alert("V3 Calculator Loaded - USD Version!");

        var currentAmount = 50000;
        var currentTerm = 12;

        function calculate() {
            var slider = document.getElementById("slider");
            currentAmount = parseFloat(slider.value);
            
            // Changed to USD
            document.getElementById("amountText").innerHTML = "USD " + currentAmount.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            
            var rate = 0.045 / 12;
            var payment = currentAmount * rate * Math.pow(1 + rate, currentTerm) / (Math.pow(1 + rate, currentTerm) - 1);
            
            // Changed to USD
            document.getElementById("paymentText").innerHTML = "USD " + payment.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
        }

        function setTerm(months) {
            currentTerm = months;
            
            document.getElementById("btn6").className = "term-btn";
            document.getElementById("btn12").className = "term-btn";
            document.getElementById("btn24").className = "term-btn";
            
            document.getElementById("btn" + months).className = "term-btn active";
            
            calculate();
        }

        calculate();
    </script>
</body>
  </html>
